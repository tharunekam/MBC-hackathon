<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Given – money back if it doesn't happen</title>
    <meta name="description" content="Bet on the second half of your hunch. If the first half doesn't happen, you get your stake back." />
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100c" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Given" />
    <meta property="og:title" content="Given – money back if it doesn't happen" />
    <meta property="og:description" content="Bet on the second half of your hunch. If the first half doesn't happen, you get your stake back. Every result is shown before you bet. Not affiliated with Gemini." />
    <!-- A link preview needs a full address for its picture. The hosted server (scripts/serve.mjs) puts its public address in
         front of this path when it serves the page; opened any other way the path is left as it is. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Given: a price ladder drawn as bars, coloured by what a bet does at each price: stake back, lose, win." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&family=Unbounded:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('given-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
