[package]
name = "living_tokens"
version = "0.1.0"
description = "Living Tokens: Programmable Solana assets driven by Gemini prediction markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "living_tokens"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
solana-program = "=1.18.17"
